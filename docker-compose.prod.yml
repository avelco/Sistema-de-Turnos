name: turnero
services:
  app:
    build:
      context: .
      dockerfile: docke/Dockerfile
    image: turnero:latest
    container_name: turnero
    restart: unless-stopped
    init: true
    env_file:
      - ./docke/.env.prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: America/Bogota
      TRUST_PROXY: 'true'
      DB_CONNECTION: pgsql
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      - traefik.enable=true
      - traefik.docker.network=service_network
      - traefik.http.routers.turnero-http.rule=Host(`turnero.surfingbird.space`)
      - traefik.http.routers.turnero-http.entrypoints=web
      - traefik.http.routers.turnero-http.middlewares=turnero-https
      - traefik.http.middlewares.turnero-https.redirectscheme.scheme=https
      - traefik.http.middlewares.turnero-https.redirectscheme.permanent=true
      - traefik.http.routers.turnero.rule=Host(`turnero.surfingbird.space`)
      - traefik.http.routers.turnero.entrypoints=websecure
      - traefik.http.routers.turnero.tls=true
      - traefik.http.routers.turnero.tls.certresolver=letsencrypt
      - traefik.http.services.turnero.loadbalancer.server.port=3000
    networks:
      - service_network
networks:
  service_network:
    external: true
